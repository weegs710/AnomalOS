[shorturls]
gh = "github:{path}"
cb = "git+https://codeberg.org/{path}"
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[all_follow]
nixpkgs = "nixpkgs"

[inputs.nixpkgs]
url = "nixpkgs:nixos-unstable"
patches = ["patches/nixpkgs/zfs-linux-7.3-compat"]

# [inputs.bumbriel]
# url = "gh:weegs710/bumbriel/feat/audio-lifecycle"

[inputs.agenix]
url = "gh:ryantm/agenix"

# Reading the removed boot.initrd.systemd.enable throws, and upstream has not merged the fix.
# See: https://github.com/nix-community/preservation/pull/36
[inputs.preservation]
url = "gh:nix-community/preservation"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"

[inputs.tack]
url = "gh:manic-systems/tack"

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/0a0d63805eb6e17e699de391171618a5d696726d"

[inputs.dusklight]
url = "gh:TwilitRealm/dusklight/v1.4.1"
submodules = true

[inputs.nix-shop]
url = "cb:weegs710/nix-shop"

# The github tarball fetcher cannot carry subprojects/scenefx, and package.nix throws without it.
[inputs.umbriel]
url = "gh:noctalia-dev/umbriel"
submodules = true

[inputs.bootvine]
url = "cb:wvhulle/bootvine"
tag = "v{version}"

[inputs.rummage]
url = "gh:barrulus/rummage"
