[shorturls]
gh = "github:{path}"
cb = "git+https://codeberg.org/{path}"

[inputs.nixpkgs]
url = "gh:NixOS/nixpkgs/nixos-unstable"

# Not followed -- the cached build is keyed to its own pinned nixpkgs; following forces a local recompile.
[inputs.nix-cachyos-kernel]
url = "gh:xddxdd/nix-cachyos-kernel/release"

[inputs.agenix]
url = "gh:ryantm/agenix"
follows = { nixpkgs = "nixpkgs" }

[inputs.preservation]
url = "gh:nix-community/preservation"

[inputs.hjem]
url = "gh:feel-co/hjem"
follows = { nixpkgs = "nixpkgs" }

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"
follows = { nixpkgs = "nixpkgs" }

[inputs.tack]
url = "gh:manic-systems/tack"

[inputs.noctalia]
url = "gh:noctalia-dev/noctalia"

[inputs.concord]
url = "gh:chojs23/concord"
follows = { nixpkgs = "nixpkgs" }
