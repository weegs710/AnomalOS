[shorturls]
gh = "github:{path}"
cb = "git+https://codeberg.org/{path}"
nixpkgs = "https://channels.nixos.org/{path}/nixexprs.tar.zst"

[all_follow]
nixpkgs = "nixpkgs"

[inputs.nixpkgs]
url = "nixpkgs:nixos-unstable"
patches = ["patches/nixpkgs/zfs-linux-7.3-compat"]

# [inputs.bumbriel]
# url = "gh:weegs710/bumbriel/feat/audio-lifecycle"

[inputs.agenix]
url = "gh:ryantm/agenix"

# Reading the removed boot.initrd.systemd.enable throws, and upstream has not merged the fix.
# See: https://github.com/nix-community/preservation/pull/36
[inputs.preservation]
url = "gh:nix-community/preservation"

[inputs.hjem]
url = "gh:feel-co/hjem"

[inputs.nix-index-database]
url = "gh:nix-community/nix-index-database"

# cache.manic.systems only holds builds against tack's own nixpkgs lock.
[inputs.tack]
url = "gh:manic-systems/tack"
exclude_follow = ["nixpkgs"]

# The cachix branch only advances once CI has pushed it to noctalia.cachix.org, built against noctalia's own nixpkgs lock.
[inputs.noctalia]
url = "gh:noctalia-dev/noctalia/cachix"
exclude_follow = ["nixpkgs"]

[inputs.dusklight]
url = "gh:TwilitRealm/dusklight/v1.4.1"
submodules = true

[inputs.nix-shop]
url = "cb:weegs710/nix-shop"

# The github tarball fetcher cannot carry subprojects/scenefx, and package.nix throws without it.
# The cachix branch only advances once CI has pushed it to umbriel.cachix.org, built against umbriel's own nixpkgs lock.
[inputs.umbriel]
url = "gh:noctalia-dev/umbriel/cachix"
submodules = true
exclude_follow = ["nixpkgs"]

[inputs.bootvine]
url = "cb:wvhulle/bootvine"
tag = "v{version}"

# rummage-fm.cachix.org only holds builds against rummage's own nixpkgs lock.
[inputs.rummage]
url = "gh:barrulus/rummage"
exclude_follow = ["nixpkgs"]

[inputs.millennium]
url = "gh:SteamClientHomebrew/Millennium"
dir = "packages/nix"

# peepers.cachix.org only holds builds against peepers' own nixpkgs lock.
[inputs.peepers]
url = "gh:weegs710/peepers/cachix"
exclude_follow = ["nixpkgs"]
