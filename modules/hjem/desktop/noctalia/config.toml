[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

[bar.main]
auto_hide = false
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 5
center = ["active_window", "notifications"]
end = ["audio_visualizer", "volume", "tray", "clock"]
margin_edge = 5
margin_ends = 5
padding = 5
position = "top"
radius = 12
reserve_space = true
scale = 1.3799999999999999
shadow = true
start = ["workspaces"]
thickness = 47
widget_spacing = 10

[brightness]
enable_ddcutil = false

[idle.behavior.lock]
command = "noctalia:session lock"
enabled = false
timeout = 660

[idle.behavior.screen-off]
command = "noctalia:dpms-off"
enabled = false
resume_command = "noctalia:dpms-on"
timeout = 600

[location]
address = "43567"
auto_locate = false

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false
enabled = true
tint_intensity = 0.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = ["lockscreen-login-box@HDMI-A-2"]

[lockscreen_widgets.grid]
cell_size = 16
major_interval = 4
visible = true

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
box_height = 0.0
box_width = 0.0
cx = 1280.0
cy = 1317.0
output = "HDMI-A-2"
rotation = 0.0
type = "login_box"

[lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
background_color = "surface_variant"
background_opacity = 0.88
background_radius = 12.0
input_opacity = 1.0
input_radius = 6.0
show_login_button = true

[nightlight]
enabled = true
force = true
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 1.0
enable_daemon = true
layer = "overlay"
scale = 1.0
show_actions = true
show_app_name = true

[osd]
background_opacity = 1.0
orientation = "horizontal"
position = "top_center"
scale = 1.0

[osd.kinds]
bluetooth = true
brightness = true
power_profile = true
volume = true
volume_input = true
volume_output = true
wifi = true

[plugins]
enabled = ["noctalia/screen_recorder"]

[shell]
avatar_path = "~/.local/share/wallpapers/cyberstoner.webp"
clipboard_enabled = true
font_family = "Terminess Nerd Font"
telemetry_enabled = false
ui_scale = 1.2

[shell.animation]
enabled = true
speed = 1.0

[shell.panel]
borders = true
clipboard_placement = "centered"
control_center_placement = "centered"
launcher_placement = "centered"
session_placement = "centered"
shadow = true
transparency_mode = "soft"
wallpaper_placement = "attached"

[system.monitor]
enabled = true

[theme]
builtin = "Eldritch"
mode = "dark"
source = "builtin"

[theme.templates]
builtin_ids = [
  "btop",
  "gtk3",
  "gtk4",
  "ghostty",
  "hyprland",
  "kcolorscheme",
  "qt",
]
community_ids = ["zen-browser", "zed", "yazi", "hyprtoolkit"]
enable_builtin_templates = true
enable_community_templates = true

[wallpaper]
directory = "~/.local/share/wallpapers"
edge_smoothness = 0.050000000000000003
enabled = true
fill_mode = "crop"
transition = ["stripes"]
transition_duration = 100
transition_on_startup = false

[wallpaper.automation]
enabled = true
interval_seconds = 300
order = "random"
recursive = true

[wallpaper.default]
path = "/home/weegs/.local/share/wallpapers/Login Screen.webp"

[wallpaper.last]
path = "/home/weegs/.local/share/wallpapers/Login Screen.webp"

[wallpaper.monitors.HDMI-A-2]
path = "/home/weegs/.local/share/wallpapers/Login Screen.webp"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "imperial"

[widget.active_window]
max_length = 300
title_scroll = "always"

[widget.audio_visualizer]
width = 200

[widget.clock]
format = """{:%-I:%M %p}
{:%a, %d %b %Y}"""

[widget.volume]
device = "output"
show_label = false

[widget.workspaces]
display = "name"
empty_color = "secondary"
focused_color = "primary"
hide_when_empty = false
max_label_chars = 10
occupied_color = "secondary"
pill_scale = 1.0
