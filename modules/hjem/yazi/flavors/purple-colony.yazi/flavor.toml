# vim:fileencoding=utf-8:foldmethod=marker

# Purple Colony - Custom flavor matching stylix theme
# Base16 scheme by weegs710

# : Manager {{{

[mgr]
cwd = { fg = "#66ccff" }

# Hovered
hovered         = { reversed = true }
preview_hovered = { underline = true }

# Find
find_keyword  = { fg = "#ffff66", bold = true, italic = true, underline = true }
find_position = { fg = "#cc66cc", bg = "reset", bold = true, italic = true }

# Marker
marker_copied   = { fg = "#aaffaa", bg = "#aaffaa" }
marker_cut      = { fg = "#ff6666", bg = "#ff6666" }
marker_marked   = { fg = "#66ccff", bg = "#66ccff" }
marker_selected = { fg = "#ffff66", bg = "#ffff66" }

# Tab
tab_active   = { reversed = true }
tab_inactive = {}
tab_width    = 1

# Count
count_copied   = { fg = "#1b002b", bg = "#aaffaa" }
count_cut      = { fg = "#1b002b", bg = "#ff6666" }
count_selected = { fg = "#1b002b", bg = "#ffff66" }

# Border
border_symbol = "│"
border_style  = { fg = "#2f143f" }

# : }}}


# : Tabs {{{

[tabs]
active   = { fg = "#1b002b", bg = "#9999ff", bold = true }
inactive = { fg = "#9999ff", bg = "#261033" }

# : }}}


# : Mode {{{

[mode]

normal_main = { fg = "#1b002b", bg = "#9999ff", bold = true }
normal_alt  = { fg = "#9999ff", bg = "#261033" }

# Select mode
select_main = { fg = "#1b002b", bg = "#66ccff", bold = true }
select_alt  = { fg = "#66ccff", bg = "#261033" }

# Unset mode
unset_main = { fg = "#1b002b", bg = "#cc66cc", bold = true }
unset_alt  = { fg = "#cc66cc", bg = "#261033" }

# : }}}


# : Status bar {{{

[status]
overall = { bg = "#1b002b" }

# Permissions
perm_sep   = { fg = "#2f143f" }
perm_type  = { fg = "#9999ff" }
perm_read  = { fg = "#ffff66" }
perm_write = { fg = "#ff6666" }
perm_exec  = { fg = "#aaffaa" }

# Progress
progress_label  = { fg = "#ffffff", bold = true }
progress_normal = { fg = "#9999ff", bg = "#261033" }
progress_error  = { fg = "#ff6666", bg = "#261033" }

# : }}}


# : Pick {{{

[pick]
border   = { fg = "#9999ff" }
active   = { fg = "#cc66cc", bold = true }
inactive = {}

# : }}}


# : Input {{{

[input]
border   = { fg = "#9999ff" }
title    = {}
value    = {}
selected = { reversed = true }

# : }}}


# : Completion {{{

[cmp]
border = { fg = "#9999ff" }

# : }}}


# : Tasks {{{

[tasks]
border  = { fg = "#9999ff" }
title   = {}
hovered = { fg = "#cc66cc", underline = true }

# : }}}


# : Which {{{

[which]
mask            = { bg = "#261033" }
cand            = { fg = "#66ccff" }
rest            = { fg = "#c7aaff" }
desc            = { fg = "#cc66cc" }
separator       = "  "
separator_style = { fg = "#2f143f" }

# : }}}


# : Help {{{

[help]
on      = { fg = "#66ccff" }
run     = { fg = "#cc66cc" }
hovered = { reversed = true, bold = true }
footer  = { fg = "#261033", bg = "#c7aaff" }
bg      = { bg = "#1b002b" }

# : }}}


# : Notify {{{

[notify]
title_info  = { fg = "#aaffaa" }
title_warn  = { fg = "#ffff66" }
title_error = { fg = "#ff6666" }

# : }}}


# : File-specific styles {{{

[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "#66ccff" },

	# Media
	{ mime = "{audio,video}/*", fg = "#ffff66" },

	# Archives
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#cc66cc" },

	# Documents
	{ mime = "application/{pdf,doc,rtf}", fg = "#aaffaa" },

	# Fallback
	{ name = "*", fg = "#b392f0" },
	{ name = "*/", fg = "#9999ff" }
]

# : }}}
