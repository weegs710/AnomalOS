font_size 10
copy_on_select clipboard
tab_bar_style hidden

# zero disables the close prompt outright, including the one a running foreground program triggers
confirm_os_window_close 0

# a positive value is the dwell in ms before a trail is drawn, and the noctalia template colours it
cursor_trail 3

# noctalia's kitty template renders the palette here and its apply.sh looks for this exact line
include themes/noctalia.conf
