[include]
files = ["../../window/singularity-inner/effect.toml"]

# the shader's REACH (24 logical px from the client edge) has to fit inside border width + padding, so this covers the default 2 px border
[effects.preset.singularity-ring]
kind = "border"
shader = "shader.glsl"
palette = true
animated = true
speed = 1.0
padding = 22
overlay = "singularity-inner"

[effects.preset.singularity-ring.light]
spread = 10
intensity = 0.4
threshold = 0.5
