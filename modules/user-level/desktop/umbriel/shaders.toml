[include]
files = [
  "@EFFECTS@/animation/reveal/effect.toml",
  "@EFFECTS@/border/spectrum/effect.toml",
]

# One playback source shared by all three anomalos effects, so a single umbriel-audio helper serves them.
[effects.audio.sources.anomalos_playback]
provider = "pipewire"
mode = "playback"
follow_default = true

# Relative to this file, so it resolves under ~/.config/umbriel rather than the package.
[effects.preset.anomalos]
kind = "window"
palette = true
audio = "anomalos_playback"
shader = "shaders/anomalos.glsl"

# speed stays 1.0 so the ring's clock matches anomalos.glsl's and both glitch on the same beat.
[effects.preset.anomalos-ring]
kind = "border"
palette = true
animated = true
speed = 1.0
padding = 8
audio = "anomalos_playback"
shader = "shaders/anomalos-ring.glsl"

[effects.preset.anomalos-ring.light]
spread = 24
intensity = 0.8
threshold = 0.5

[effects.preset.anomalos-surge]
kind = "animation"
palette = true
audio = "anomalos_playback"
shader = "shaders/anomalos-surge.glsl"

[effects]
window = "anomalos"
border = "anomalos-ring"
# otherwise screencopy clients are handed a second frame rendered without the effects
in_capture = true
