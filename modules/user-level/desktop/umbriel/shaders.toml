[include]
files = [
  "@EFFECTS@/animation/reveal/effect.toml",
  # same layout as the community shaders collection, so an effect copies across unchanged
  "shaders/window/kzzzt/effect.toml",
  "shaders/border/kzzzt-ring/effect.toml",
  "shaders/animation/kzzzt-open/effect.toml",
  "shaders/animation/kzzzt-close/effect.toml",
]

[effects]
window = "kzzzt"
border = "kzzzt-ring"
# otherwise screencopy clients are handed a second frame rendered without the effects
in_capture = true
