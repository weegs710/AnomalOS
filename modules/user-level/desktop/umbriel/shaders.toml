[include]
files = [
  "@EFFECTS@/animation/reveal/effect.toml",
  # same layout as the community shaders collection, so an effect copies across unchanged
  "shaders/window/kzzzt/effect.toml",
  "shaders/border/kzzzt-ring/effect.toml",
  "shaders/border/singularity-ring/effect.toml",
  "shaders/cursor/singularity-cursor/effect.toml",
  "shaders/animation/kzzzt-open/effect.toml",
  "shaders/animation/kzzzt-close/effect.toml",
  "shaders/animation/slide-down/effect.toml",
]

[effects]
# no default window effect: the ring is paired with the kzzzt open and close animations only
border = "singularity-ring"
cursor = "singularity-cursor"
# otherwise screencopy clients are handed a second frame rendered without the effects
in_capture = true
# the cursor effect redraws only at this cap while the hardware cursor moves at the output's 144Hz, so a lower cap left it stepping behind fast moves
max_fps = 144
