[include]
files = ["@SHADERS@/barrulus/collection.toml"]

# The shipped definitions carry no palette key, so the two that follow noctalia's scheme are declared here.
[effects."window.smoke".content]
palette = true
passes = [{ shader = "@SHADERS@/barrulus/window/rainbow-smoke.glsl" }]

# Relative to this file, so it resolves under ~/.config/umbriel rather than the package.
[effects."window.sentient".content]
palette = true
passes = [{ shader = "shaders/sentient-circuit-v2.glsl" }]

# collection.toml registers no rings, so the lightning border is declared here with its own tuning.
[effects.lightning-ring.border.outer]
enabled = true
animated = true
palette = true
speed = 0.35
# The ring outset is capped at 2.5x the border width, so less than that clips the sparks.
padding = 30
passes = [{ shader = "@SHADERS@/barrulus/rings/lightning.glsl" }]

[effects.lightning-ring.border.outer.light]
enabled = true
spread = 80
intensity = 1.6
threshold = 0.5

[effects.lightning-ring.border.inner]
enabled = false

# reveal.glsl ships without a definition of its own, so the workspace leaf is declared here.
[effects.workspace-reveal.workspace]
passes = [{ shader = "@SHADERS@/barrulus/animations/reveal.glsl" }]

# animations.toml already owns the name lightning-melt, so this open/close hybrid takes its own.
[effects.lightning-melt-mix.open]
duration_ms = 400
curve = "linear"
passes = [{ shader = "@SHADERS@/barrulus/animations/lightning-open.glsl" }]

[effects.lightning-melt-mix.close]
duration_ms = 500
curve = "linear"
passes = [{ shader = "@SHADERS@/barrulus/animations/melt-close.glsl" }]

# Registering a definition selects nothing, so every effect above is named here.
[appearance]
effects = [
  "cursor.comet",
  "lightning-ring",
  "workspace-reveal",
  "lightning-melt-mix",
]
