[include]
files = [
  "@EFFECTS@/animation/reveal/effect.toml",
  # same layout as the community shaders collection, so an effect copies across unchanged
  "shaders/animation/slide-down/effect.toml",
]

[effects]
# otherwise screencopy clients are handed a second frame rendered without the effects
in_capture = true
# the cursor effect redraws only at this cap while the hardware cursor moves at the output's 144Hz, so a lower cap left it stepping behind fast moves
max_fps = 144
