[include]
files = [
  "@EFFECTS@/animation/reveal/effect.toml",
]

# Relative to this file, so it resolves under ~/.config/umbriel rather than the package.
[effects.preset.kzzzt]
kind = "window"
palette = true
shader = "shaders/kzzzt.glsl"

# speed stays 1.0 so the ring's clock matches kzzzt.glsl's and both glitch on the same beat.
[effects.preset.kzzzt-ring]
kind = "border"
palette = true
animated = true
speed = 1.0
padding = 8
shader = "shaders/kzzzt-ring.glsl"

[effects.preset.kzzzt-ring.light]
spread = 24
intensity = 0.8
threshold = 0.5

[effects.preset.kzzzt-surge]
kind = "animation"
palette = true
shader = "shaders/kzzzt-surge.glsl"

[effects.preset.kzzzt-close]
kind = "animation"
palette = true
shader = "shaders/kzzzt-close.glsl"

[effects]
window = "kzzzt"
border = "kzzzt-ring"
# otherwise screencopy clients are handed a second frame rendered without the effects
in_capture = true
