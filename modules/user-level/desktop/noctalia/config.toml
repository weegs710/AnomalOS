[accessibility]
ui_scale = 1.2500000111758709

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

[bar.main]
auto_hide = false
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 5
center = [ "active_window", "notifications" ]
end = [ "audio_visualizer", "volume", "tray", "clock" ]
margin_edge = 5
margin_ends = 5
padding = 5
position = "top"
radius = 12
reserve_space = true
scale = 1.3799999999999999
shadow = true
start = [ "workspaces" ]
thickness = 47
widget_spacing = 10

[brightness]
enable_ddcutil = false

[idle.behavior.lock]
command = "noctalia:session lock"
enabled = false
timeout = 660

[idle.behavior.screen-off]
command = "noctalia:dpms-off"
enabled = false
resume_command = "noctalia:dpms-on"
timeout = 600

[location]
address = "43567"
auto_locate = false

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false
enabled = true
tint_intensity = 0.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@FALLBACK", "lockscreen-login-box@HDMI-A-1", "lockscreen-login-box@HDMI-A-2" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "FALLBACK"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@FALLBACK".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1321.0
    output = "HDMI-A-1"
    placement_height = 1440.0
    placement_width = 2560.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2"]
    box_height = 196.0
    box_width = 720.0
    cx = 1280.0
    cy = 1317.0
    output = "HDMI-A-2"
    placement_height = 0.0
    placement_width = 0.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-2".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[nightlight]
enabled = true
force = true
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 1.0
enable_daemon = true
layer = "overlay"
scale = 1.0
show_actions = true
show_app_name = true

[osd]
background_opacity = 1.0
orientation = "horizontal"
position = "top_center"
scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    power_profile = true
    volume = true
    volume_input = true
    volume_output = true
    wifi = true

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "~/.local/share/wallpapers/cyberstoner.webp"
clipboard_enabled = false
clipboard_keep_from_closed_apps = true
font_family = "Terminess Nerd Font"
telemetry_enabled = false

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.panel]
    borders = true
    shadow = true
    transparency_mode = "soft"
    wallpaper_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    copy_to_clipboard = true
    directory = "~/Pictures/shots"
    filename_pattern = "shot_%Y%m%d_%H%M%S"
    freeze_screen = true
    pipe_command = ""
    pipe_to_command = false
    remember_last_region = false
    save_to_file = true
    show_cursor = false

[system.monitor]
enabled = true

[theme]
builtin = "Eldritch"
custom_palette = "Cymagentan"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "ghostty", "umbriel", "kcolorscheme", "qt" ]
    community_ids = [ "claude-code", "gimp", "inkscape", "zed", "heroiclauncher", "steam", "zathura", "hyprtoolkit", "yazi" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "~/.local/share/wallpapers"
edge_smoothness = 0.4999999888241291
enabled = true
fill_mode = "crop"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_duration = 500
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_seconds = 60
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/weegs/.local/share/wallpapers/the-neon-lit-streets-of-a-cyberpunk-anime-night-city-with-this-captivating-4k-wallpaper-generated-ai-free-photo.jpg"

    [wallpaper.last]
    path = "/home/weegs/.local/share/wallpapers/the-neon-lit-streets-of-a-cyberpunk-anime-night-city-with-this-captivating-4k-wallpaper-generated-ai-free-photo.jpg"

    [wallpaper.monitors.FALLBACK]
    path = "/home/weegs/.local/share/wallpapers/cannabis-grow-room.webp"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/weegs/.local/share/wallpapers/the-neon-lit-streets-of-a-cyberpunk-anime-night-city-with-this-captivating-4k-wallpaper-generated-ai-free-photo.jpg"

    [wallpaper.monitors.HDMI-A-2]
    path = "/home/weegs/.local/share/wallpapers/Sampo.webp"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "imperial"

[widget.active_window]
max_length = 300
title_scroll = "always"

[widget.audio_visualizer]
width = 200

[widget.clock]
format = """{:%-I:%M %p}
{:%a, %d %b %Y}"""

[widget.volume]
device = "output"
show_label = false

[widget.workspaces]
empty_color = "secondary"
focused_color = "primary"
hide_when_empty = false
label_source = "name"
max_label_chars = 10
occupied_color = "tertiary"
pill_scale = 1.0
show_labels = true
