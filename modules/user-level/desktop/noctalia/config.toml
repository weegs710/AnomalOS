[accessibility]
ui_scale = 1.2500000111758709

[audio]
enable_overdrive = false
enable_sounds = false
sound_volume = 0.5

[bar.main]
auto_hide = false
background_opacity = 0.0
capsule = true
capsule_border = "primary"
capsule_opacity = 0.75
capsule_radius = 5
center = [ "active_window", "notifications" ]
end = [ "audio_visualizer", "volume", "tray", "clock" ]
margin_edge = 5
margin_ends = 5
padding = 5
position = "top"
radius = 12
reserve_space = true
scale = 1.3799999999999999
shadow = true
start = [ "workspaces" ]
thickness = 47
widget_spacing = 10

[brightness]
enable_ddcutil = false

[idle.behavior.lock]
command = "noctalia:session lock"
enabled = false
timeout = 660

[idle.behavior.screen-off]
command = "noctalia:dpms-off"
enabled = false
resume_command = "noctalia:dpms-on"
timeout = 600

[location]
address = "43567"
auto_locate = false

[lockscreen]
blur_intensity = 0.0
blurred_desktop = false
enabled = true
tint_intensity = 0.0

[lockscreen_widgets]
enabled = false
schema_version = 2

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

[nightlight]
enabled = true
force = true
temperature_day = 6500
temperature_night = 4000

[notification]
background_opacity = 1.0
enable_daemon = true
layer = "overlay"
scale = 1.0
show_actions = true
show_app_name = true

[osd]
background_opacity = 1.0
orientation = "horizontal"
position = "top_center"
scale = 1.0

    [osd.kinds]
    bluetooth = true
    brightness = true
    power_profile = true
    volume = true
    volume_input = true
    volume_output = true
    wifi = true

[plugins]
enabled = [ "noctalia/screen_recorder" ]

[shell]
avatar_path = "~/.local/share/wallpapers/cyberstoner.webp"
clipboard_enabled = false
clipboard_keep_from_closed_apps = true
font_family = "SpaceGrotesk Nerd Font Propo"
telemetry_enabled = false
umbriel_audio_provider_enabled = true

    [shell.animation]
    enabled = true
    speed = 1.0

    [shell.greeter_sync]
    auto_sync = true

    [shell.panel]
    borders = true
    shadow = true
    transparency_mode = "soft"
    wallpaper_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    copy_to_clipboard = true
    directory = "~/Pictures/shots"
    filename_pattern = "shot_%Y%m%d_%H%M%S"
    freeze_screen = true
    pipe_command = ""
    pipe_to_command = false
    remember_last_region = false
    save_to_file = true
    show_cursor = false

[system.monitor]
enabled = true

[theme]
builtin = "Eldritch"
custom_palette = "Triglavian"
mode = "dark"
pure_black_dark = true
source = "custom"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "umbriel", "kcolorscheme", "qt" ]
    community_ids = [ "gimp", "inkscape", "zed", "heroiclauncher", "steam", "zathura" ]
    enable_builtin_templates = true
    enable_community_templates = true

[wallpaper]
directory = "~/.local/share/wallpapers"
edge_smoothness = 0.4999999888241291
enabled = true
fill_mode = "crop"
transition = [ "disc", "fade", "honeycomb", "stripes", "wipe", "zoom" ]
transition_duration = 500
transition_on_startup = false

    [wallpaper.automation]
    enabled = false
    interval_seconds = 300
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/weegs/.local/share/wallpapers/weegs710.webp"

    [wallpaper.last]
    path = "/home/weegs/.local/share/wallpapers/weegs710.webp"

    [[wallpaper.favorite]]
    path = "/home/weegs/.local/share/wallpapers/eve/The uni blob.webp"
    theme_mode = "auto"

[weather]
effects = true
enabled = true
refresh_minutes = 30
unit = "imperial"

[widget.active_window]
max_length = 300
title_scroll = "always"

[widget.audio_visualizer]
width = 200

[widget.clock]
format = """{:%-I:%M %p}
{:%a, %d %b %Y}"""

[widget.volume]
device = "output"
show_label = false

[widget.workspaces]
empty_color = "secondary"
focused_color = "primary"
hide_when_empty = false
label_source = "name"
max_label_chars = 10
occupied_color = "tertiary"
pill_scale = 1.0
show_labels = true
