[animations]




[animations.events]
'quick_look' = 'scan'







[animations.durations]
'quick_look' = 710
'invalid_operation' = 1000
'focus_change' = 500
'selection_change' = 500








[status_bar]
text_size = 15.0

[startup]
mode = "home"

# family is parsed as a fontconfig pattern, so "sans-serif" comes out as family "sans"
[font]
family = "SpaceGrotesk Nerd Font Propo"
size = 15.0
monospace = "SpaceMono Nerd Font Mono"

# own app-id so umbriel floats it on the current workspace instead of the main kitty's rule
[terminal]
program = "kitty"
args = ["--class", "rummage-term"]

[icon]
theme = "builtin"

[keybindings]
toggle_hidden = "period"

[[actions]]
id = "annotate-satty"
label = "Annotate in satty"
argv = ["satty", "-f", "{file}"]
mime = ["image/*"]
placement = "menu"

['animations'.'ambient']
'intensity' = 0.35
'speed' = 2
'selection_glow' = true
'background' = true
